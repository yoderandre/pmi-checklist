<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PMI Checklist App</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background-color: #121212; color: #e0e0e0; font-family: -apple-system, system-ui, sans-serif; padding: 12px; margin: 0; }
    .container { background: #1f2023; border: 1px solid #333; border-radius: 12px; padding: 16px; max-width: 600px; margin: 0 auto; }
    h2 { font-size: 1.2rem; margin-top: 0; color: #fff; }
    input[type="text"], input[type="date"], textarea { background: #2b2c30; color: #fff; border: 1px solid #555; border-radius: 8px; padding: 12px; font-size: 1rem; width: 100%; margin-top: 4px; }
    button { padding: 12px 18px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: 1rem; }
    .btn-accent { background: #4caf50; color: #fff; width: 100%; }
    .btn-ghost { background: transparent; color: #aaa; border: 1px solid #555; }
    
    /* Interactive Checklist Item Styles */
    .item-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px; border-radius: 8px; background: rgba(255,255,255,0.04); margin-bottom: 8px; font-size: 0.95rem; user-select: none; }
    .item-label { flex: 1; transition: all 0.2s ease; }
    .item-label.na-text { text-decoration: line-through; color: #777; }
    
    .status-badge { font-weight: bold; padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; border: 1px solid transparent; min-width: 75px; text-align: center; }
    .status-badge.unchecked { background: #3a2222; color: #f44336; border-color: #f44336; }
    .status-badge.completed { background: #1b3e20; color: #4caf50; border-color: #4caf50; }
    .status-badge.na { background: #2b2c30; color: #888; border-color: #555; }

    canvas { background: #2b2c30; border: 1px solid #555; border-radius: 8px; touch-action: none; width: 100%; height: 140px; display: block; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Preventative Maintenance Inspection Safety Checklist</h2>
    <p style="color: #a0a5aa; font-size: 0.8rem;">Machine Equipment Safety Audit</p>
    
    <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px;">
      <div>
        <label style="font-size:0.85rem;">Machine Name / ID</label>
        <input type="text" id="machineId" value="151-">
      </div>
      <div>
        <label style="font-size:0.85rem;">Date of Inspection</label>
        <input type="date" id="inspectionDate">
      </div>
    </div>

    <div style="margin-bottom: 20px;">
      <div style="margin-bottom: 12px;">
        <label style="font-size:0.85rem;">Inspector Printed Name</label>
        <input type="text" id="inspectorName" placeholder="Type full name...">
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
        <label style="font-size:0.85rem;">Inspector Signature (Draw Below)</label>
        <button type="button" class="btn-ghost" onclick="clearSignature()" style="padding: 4px 10px; font-size: 0.8rem;">Clear</button>
      </div>
      <canvas id="sigCanvas" width="500" height="150"></canvas>
    </div>

    <h3 style="font-size: 1.05rem; color: #fff;">Inspection Checklist</h3>
    <p style="color: #888; font-size: 0.75rem; margin-top: -8px; margin-bottom: 12px;">Tap item state badge to toggle: <b>Unchecked ➔ Completed ➔ N/A</b></p>

    <div id="checklist">
      <!-- Standard items rendered dynamically with 3-state logic -->
    </div>

    <h3 style="font-size: 1.05rem; color: #fff; margin-top: 20px;">Maintenance &amp; Repairs</h3>
    <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px;">
      <div>
        <label style="font-size:0.85rem;">Maintenance Needed for Future</label>
        <input type="text" id="maintNeeded">
      </div>
      <div>
        <label style="font-size:0.85rem;">Date of Scheduled Repair</label>
        <input type="date" id="schedDate">
      </div>
      <div>
        <label style="font-size:0.85rem;">Date Repair Completed</label>
        <input type="date" id="completedDate">
      </div>
    </div>

    <div style="margin-bottom: 20px;">
      <label style="font-size:0.85rem;">Notes &amp; Remarks</label>
      <textarea id="notes" style="height:80px;"></textarea>
    </div>

    <button id="submitBtn" class="btn-accent" onclick="submitInspection()">Submit Inspection</button>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxD2F3EA3EAIeH0tS37HDjh-HMDySClL60nUjGjmLBhiNqicfYSordLQumL2i3VdUpWGA/exec";

    const checklistItems = [
      "Inspect wiring for damage or wear",
      "Test electrical connections and insulation",
      "Verify operation of electrical controls & sensors",
      "Check emergency stop functions",
      "Check for pneumatic leaks",
      "Check for Gas Leaks",
      "Check for Hydraulic leaks",
      "Inspect fluid reservoirs & lines for leaks",
      "Check air line oil level",
      "Inspect belts for damage or fraying",
      "Check for irregular erosion & wear",
      "Check alignment & tension on belts/chains"
    ];

    // Render 3-State Checklist
    const checklistContainer = document.getElementById('checklist');
    checklistItems.forEach((item, index) => {
      const row = document.createElement('div');
      row.className = 'item-row';
      row.innerHTML = `
        <span class="item-label" id="label-${index}">${item}</span>
        <span class="status-badge unchecked" id="badge-${index}" onclick="toggleState(${index})">Pending</span>
      `;
      checklistContainer.appendChild(row);
    });

    // Toggle logic: unchecked -> completed -> na -> unchecked
    const itemStates = {}; // Stores state per index: 'unchecked', 'completed', 'na'

    function toggleState(index) {
      const currentState = itemStates[index] || 'unchecked';
      const label = document.getElementById(`label-${index}`);
      const badge = document.getElementById(`badge-${index}`);

      if (currentState === 'unchecked') {
        itemStates[index] = 'completed';
        badge.className = 'status-badge completed';
        badge.innerText = '✔ Done';
        label.className = 'item-label';
      } else if (currentState === 'completed') {
        itemStates[index] = 'na';
        badge.className = 'status-badge na';
        badge.innerText = 'N/A';
        label.className = 'item-label na-text';
      } else {
        itemStates[index] = 'unchecked';
        badge.className = 'status-badge unchecked';
        badge.innerText = 'Pending';
        label.className = 'item-label';
      }
    }

    // Default inspection date
    document.getElementById('inspectionDate').value = new Date().toISOString().split('T')[0];

    // Canvas Signature Setup
    const canvas = document.getElementById('sigCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false, hasSigned = false;

    function initCanvas() {
      ctx.strokeStyle = "#ff4d4d"; // Red signature ink
      ctx.lineWidth = 3;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
    }
    initCanvas();

    function getTouchPos(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    function startDrawing(e) {
      isDrawing = true; hasSigned = true;
      const pos = getTouchPos(e);
      ctx.beginPath(); ctx.moveTo(pos.x, pos.y);
      if (e.type === 'touchstart') e.preventDefault();
    }

    function draw(e) {
      if (!isDrawing) return;
      if (e.type === 'touchmove') e.preventDefault();
      const pos = getTouchPos(e);
      ctx.lineTo(pos.x, pos.y); ctx.stroke();
    }

    function stopDrawing() { isDrawing = false; }

    canvas.addEventListener('touchstart', startDrawing, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    canvas.addEventListener('touchend', stopDrawing);
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);

    function clearSignature() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      initCanvas();
      hasSigned = false;
    }

    function submitInspection() {
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = "Uploading...";

      const machineId = document.getElementById('machineId').value.trim() || 'UNKNOWN';
      const inspectionDate = document.getElementById('inspectionDate').value || 'NO-DATE';
      const inspectorName = document.getElementById('inspectorName').value.trim() || 'N/A';
      const maintNeeded = document.getElementById('maintNeeded').value || 'N/A';
      const schedDate = document.getElementById('schedDate').value || 'N/A';
      const completedDate = document.getElementById('completedDate').value || 'N/A';
      const notes = document.getElementById('notes').value || 'N/A';

      const sigDataUrl = hasSigned ? canvas.toDataURL('image/png') : '';

      let itemsListHtml = '';
      checklistItems.forEach((itemText, i) => {
        const state = itemStates[i] || 'unchecked';
        let iconHtml = '';
        let textStyle = '';

        if (state === 'completed') {
          iconHtml = '<span style="color:#4caf50; font-weight:bold; font-size:1.1rem;">&#10004;</span>';
        } else if (state === 'na') {
          iconHtml = '<span style="color:#888; font-weight:bold; font-size:0.85rem; background:#333; padding:2px 6px; border-radius:4px;">N/A</span>';
          textStyle = 'text-decoration: line-through; color: #777;';
        } else {
          iconHtml = '<span style="color:#f44336; font-weight:bold; font-size:1.1rem;">&#10008;</span>';
        }

        itemsListHtml += `
          <div style="display:flex; align-items:center; justify-content:space-between; padding:10px; border-bottom:1px solid #333;">
            <span style="${textStyle}">${itemText}</span>
            <div>${iconHtml}</div>
          </div>`;
      });

      const htmlContent = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Completed PMI - ${machineId}-${inspectionDate}</title>
  <style>
    body { background: #121212; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 12px; }
    .container { background: #1f2023; border: 1px solid #7f8489; border-radius: 12px; padding: 16px; max-width: 600px; margin: 0 auto; }
    .meta-box { margin-bottom: 16px; background: #2b2c30; padding: 12px; border-radius: 8px; }
    .sig-img { background: #1f2023; border: 1px solid #555; border-radius: 6px; max-width: 100%; height: 80px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Preventative Maintenance Inspection Safety Checklist</h2>
    <div class="meta-box">
      <div><strong>Machine Name / ID:</strong> ${machineId}</div>
      <div><strong>Date of Inspection:</strong> ${inspectionDate}</div>
    </div>
    <div class="meta-box">
      <div><strong>Inspector Printed Name:</strong> ${inspectorName}</div>
      <div><strong>Inspector Signature:</strong></div>
      ${sigDataUrl ? `<img src="${sigDataUrl}" class="sig-img" alt="Signature">` : '<i>No signature</i>'}
    </div>
    <h3>Inspection Checklist</h3>
    <div>${itemsListHtml}</div>
    <h3>Maintenance & Repairs</h3>
    <div class="meta-box">
      <div><strong>Maintenance Needed:</strong> ${maintNeeded}</div>
      <div><strong>Scheduled Repair:</strong> ${schedDate}</div>
      <div><strong>Repair Completed:</strong> ${completedDate}</div>
    </div>
    <h3>Notes & Remarks</h3>
    <div style="background:#2b2c30; padding:12px; border-radius:8px;">${notes}</div>
  </div>
</body>
</html>`;

      const payload = {
        machineId: machineId,
        inspectionDate: inspectionDate,
        inspectorName: inspectorName,
        maintNeeded: maintNeeded,
        schedDate: schedDate,
        completedDate: completedDate,
        notes: notes,
        htmlContent: htmlContent
      };

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        alert(`Inspection for ${machineId} submitted successfully!`);
        btn.disabled = false;
        btn.textContent = "Submit Inspection";
        clearSignature();
      })
      .catch(err => {
        alert("Error submitting form: " + err);
        btn.disabled = false;
        btn.textContent = "Submit Inspection";
      });
    }
  </script>
</body>
</html>
